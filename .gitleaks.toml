title = "iTestAgent Gitleaks Config"

# G7 (guide §16): only tooling/third-party directories may be broadly
# excluded. docs/ and fixtures/ must NOT be broadly excluded — secrets
# there must be found, and any false-positive test values need the
# narrowest rule-id + literal-path + fingerprint allowlist instead.
[allowlist]
  paths = [
    '''^node_modules\/''',
    '''^.opencode\/''',
    '''^.codegraph\/''',
  ]
