name: simulator-ci

on:
  workflow_dispatch:
  push:
    branches: [dev-1.0]

jobs:
  simulator:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run evidence:verify --scope g5-sim --require-current
