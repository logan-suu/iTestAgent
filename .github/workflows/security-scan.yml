name: security-scan

on:
  push:
    branches: [dev-1.0, main]
  pull_request:

jobs:
  gitleaks:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
