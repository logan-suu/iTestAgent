name: ci

on:
  push:
    branches: [dev-1.0, main]
  pull_request:

jobs:
  check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      # B00 §12.1: the security gate tests assert core.hooksPath is configured.
      - run: git config core.hooksPath .githooks
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test:ci
